{% extends "base.html" %}
{% block title %}Bonds — Market Dashboard{% endblock %}

{% block content %}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <h2 class="text-lg font-semibold text-gray-200">Government Bonds</h2>
        <span class="text-xs text-gray-500 htmx-indicator" id="bonds-loading">Updating...</span>
    </div>

    <div hx-get="/partials/bonds"
         hx-trigger="load, every 60s"
         hx-swap="innerHTML"
         hx-indicator="#bonds-loading">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <div class="panel bg-surface rounded-lg border border-gray-800 p-4">
                <div class="skeleton h-6 w-40 rounded mb-4"></div>
                <div class="space-y-2">
                    {% for i in range(5) %}
                    <div class="skeleton h-8 rounded"></div>
                    {% endfor %}
                </div>
            </div>
            <div class="panel bg-surface rounded-lg border border-gray-800 p-4">
                <div class="skeleton h-64 rounded"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
