{% extends "base.html" %}
{% block title %}Forex — Market Dashboard{% endblock %}

{% block content %}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <h2 class="text-lg font-semibold text-gray-200">Forex</h2>
        <span class="text-xs text-gray-500 htmx-indicator" id="forex-loading">Updating...</span>
    </div>

    <!-- Heatmap with period selector -->
    <div class="panel bg-surface rounded-lg border border-gray-800 p-4">
        <div class="flex items-center justify-between mb-4">
            <h3 class="text-sm font-semibold text-gray-300">Currency Heatmap</h3>
            <div class="flex gap-1" id="heatmap-periods">
                {% for p in ["1D", "1W", "1M", "3M", "YTD", "1Y"] %}
                <button class="px-2 py-1 text-xs rounded
                               {% if p == '1D' %}bg-blue-600 text-white{% else %}bg-gray-800 text-gray-400 hover:bg-gray-700{% endif %}"
                        hx-get="/partials/forex-heatmap?period={{ p }}"
                        hx-target="#heatmap-container"
                        hx-swap="innerHTML"
                        onclick="document.querySelectorAll('#heatmap-periods button').forEach(b => {
                            b.className = 'px-2 py-1 text-xs rounded bg-gray-800 text-gray-400 hover:bg-gray-700';
                        }); this.className = 'px-2 py-1 text-xs rounded bg-blue-600 text-white';">
                    {{ p }}
                </button>
                {% endfor %}
            </div>
        </div>
        <div id="heatmap-container"
             hx-get="/partials/forex-heatmap?period=1D"
             hx-trigger="load"
             hx-swap="innerHTML">
            <div class="skeleton h-64 rounded"></div>
        </div>
    </div>

    <!-- Correlations -->
    <div class="panel bg-surface rounded-lg border border-gray-800 p-4"
         hx-get="/partials/forex-correlations"
         hx-trigger="load, every 120s"
         hx-swap="innerHTML"
         hx-indicator="#forex-loading">
        <div class="skeleton h-6 w-48 rounded mb-4"></div>
        <div class="skeleton h-48 rounded"></div>
    </div>

    <!-- Pairs table -->
    <div class="panel bg-surface rounded-lg border border-gray-800 p-4"
         hx-get="/partials/forex-pairs"
         hx-trigger="load, every 60s"
         hx-swap="innerHTML"
         hx-indicator="#forex-loading">
        <div class="skeleton h-6 w-32 rounded mb-4"></div>
        <div class="space-y-2">
            {% for i in range(10) %}
            <div class="skeleton h-7 rounded"></div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
