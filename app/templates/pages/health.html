{% extends "base.html" %}
{% block title %}Source Health — Market Dashboard{% endblock %}

{% block content %}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <h2 class="text-lg font-semibold text-gray-200">Source Health</h2>
        <span class="text-xs text-gray-500">{{ source_count }} sources — auto-refreshes every 30s</span>
    </div>

    <div hx-get="/partials/source-health"
         hx-trigger="load, every 30s"
         hx-swap="innerHTML">
        <div class="panel bg-surface rounded-lg border border-gray-800 p-4">
            <div class="skeleton h-96 rounded"></div>
        </div>
    </div>
</div>
{% endblock %}
